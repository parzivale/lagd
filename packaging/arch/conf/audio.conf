# Arguments for lagd-audio. See `lagd-audio --help`.
#
# Set --target to the real sink's node name, from `wpctl status` or
# `pw-cli ls Node`. Without it the delayed output autoconnects to the default
# sink, which is a feedback loop the moment lagd itself becomes the default.
#
#   LAGD_AUDIO_ARGS=--delay-ms 0 --target alsa_output.pci-0000_00_1f.3.analog-stereo
#
LAGD_AUDIO_ARGS=--delay-ms 0
