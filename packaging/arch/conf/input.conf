# Arguments for lagd-input. See `lagd-input --help`.
#
# Autodetects every keyboard and pointer when no --device is given. Prefer
# /dev/input/by-id paths: eventN numbers follow probe order and move between boots.
#
#   LAGD_INPUT_ARGS=--delay-ms 40 --device /dev/input/by-id/usb-Example-event-kbd
#
LAGD_INPUT_ARGS=--delay-ms 0
